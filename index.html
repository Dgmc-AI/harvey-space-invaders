<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Harvey's Space Invaders</title><style>body{margin:0;background:#030712;color:#fff;font-family:monospace;display:flex;justify-content:center}.wrap{width:min(100%,760px);padding:12px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}button{min-height:48px;border:1px solid #475569;border-radius:12px;background:#111827;color:white;font-weight:700;font-size:16px;padding:8px 12px}canvas{width:100%;height:auto;border:1px solid #334155;border-radius:12px;display:block;touch-action:none}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.start{width:100%;margin-top:10px;background:#164e63}.hint{color:#94a3b8;font-size:12px}</style></head><body><div class='wrap'><div class='top'><b>HARVEY'S SPACE INVADERS</b><button id='sound'>🔊 SOUND</button></div><canvas id='game' width='720' height='620'></canvas><div class='controls'><button id='left'>◀ LEFT</button><button id='fire'>🔥 FIRE</button><button id='right'>RIGHT ▶</button></div><button id='start' class='start'>START GAME</button><p class='hint'>Tap START once to enable arcade sound on iPhone/iPad. Desktop: ← → and Space.</p></div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),start=document.getElementById('start'),soundBtn=document.getElementById('sound');let W=c.width,H=c.height,run=false,sound=true,audio=null,score=0,lives=3,level=1,keys={},last=0,stepT=0,stepTone=0,player,shots=[],enemyShots=[],invaders=[],stars=[];
function audioOn(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==='suspended')audio.resume()}
function tone(f,d=.08,type='square',vol=.045,slide=0){if(!sound||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d)}
function sfx(n){if(n==='fire')tone(620,.07,'square',.035,-360);if(n==='hit'){tone(170,.09,'sawtooth',.04,-90);tone(90,.12,'square',.025,60)}if(n==='step')tone(stepTone++%2?72:92,.035,'square',.018);if(n==='hurt')tone(210,.28,'sawtooth',.055,-170);if(n==='start'){tone(220,.08);setTimeout(()=>tone(330,.08),90);setTimeout(()=>tone(520,.12),180)}if(n==='level'){tone(440,.08);setTimeout(()=>tone(660,.08),90);setTimeout(()=>tone(880,.14),180)}if(n==='over'){tone(260,.16,'square',.05,-100);setTimeout(()=>tone(130,.35,'sawtooth',.05,-80),160)}}
function reset(full=true){if(full){score=0;lives=3;level=1}player={x:W/2-24,y:H-64,w:48,h:24,speed:330,cool:0};shots=[];enemyShots=[];makeInvaders()}
function makeInvaders(){invaders=[];const cols=8,rows=Math.min(5,3+Math.floor((level-1)/2));for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)invaders.push({x:95+q*66,y:105+r*48,w:34,h:22,alive:true});invaders.dir=1;invaders.speed=30+level*9}
for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,a:Math.random()*.7+.2});
function fire(){if(!run||player.cool>0)return;shots.push({x:player.x+player.w/2-2,y:player.y-8,w:4,h:14});player.cool=.22;sfx('fire')}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(!run)return;player.cool=Math.max(0,player.cool-dt);let m=0;if(keys.ArrowLeft)m--;if(keys.ArrowRight)m++;player.x=Math.max(8,Math.min(W-player.w-8,player.x+m*player.speed*dt));shots.forEach(b=>b.y-=520*dt);enemyShots.forEach(b=>b.y+=250*dt);shots=shots.filter(b=>b.y>-20);enemyShots=enemyShots.filter(b=>b.y<H+20);let min=9999,max=-1,lowest=0;invaders.forEach(v=>{if(v.alive){min=Math.min(min,v.x);max=Math.max(max,v.x+v.w);lowest=Math.max(lowest,v.y+v.h)}});let edge=(invaders.dir>0&&max>=W-24)||(invaders.dir<0&&min<=24);if(edge){invaders.dir*=-1;invaders.forEach(v=>{if(v.alive)v.y+=18})}else invaders.forEach(v=>{if(v.alive)v.x+=invaders.dir*invaders.speed*dt});stepT+=dt;if(stepT>Math.max(.18,.65-level*.04)){stepT=0;sfx('step')}for(const b of shots)for(const v of invaders)if(v.alive&&rect(b,v)){v.alive=false;b.y=-99;score+=10*level;sfx('hit');break}if(Math.random()<dt*(.6+level*.15)){const alive=invaders.filter(v=>v.alive);if(alive.length){const v=alive[Math.floor(Math.random()*alive.length)];enemyShots.push({x:v.x+v.w/2-2,y:v.y+v.h,w:4,h:12})}}for(const b of enemyShots)if(rect(b,player)){b.y=H+99;lives--;sfx('hurt');if(lives<=0){run=false;sfx('over');start.textContent='PLAY AGAIN'}else player.x=W/2-player.w/2}if(lowest>player.y){lives=0;run=false;sfx('over');start.textContent='PLAY AGAIN'}if(!invaders.some(v=>v.alive)){level++;sfx('level');makeInvaders();shots=[];enemyShots=[]}}
function pixel(v,r){x.fillStyle=r===0?'#67e8f9':r===1?'#a7f3d0':'#f0abfc';x.fillRect(v.x+7,v.y,v.w-14,4);x.fillRect(v.x+3,v.y+4,v.w-6,5);x.fillRect(v.x,v.y+9,v.w,7);x.fillStyle='#030712';x.fillRect(v.x+8,v.y+8,5,5);x.fillRect(v.x+v.w-13,v.y+8,5,5);x.fillStyle=r===0?'#67e8f9':r===1?'#a7f3d0':'#f0abfc';x.fillRect(v.x+5,v.y+16,6,6);x.fillRect(v.x+v.w-11,v.y+16,6,6)}
function draw(){x.fillStyle='#030712';x.fillRect(0,0,W,H);for(const s of stars){x.globalAlpha=s.a;x.fillStyle='#fff';x.fillRect(s.x,s.y,s.s,s.s)}x.globalAlpha=1;x.font='bold 20px monospace';x.fillStyle='#67e8f9';x.fillText('SCORE '+String(score).padStart(5,'0'),18,32);x.textAlign='center';x.fillStyle='#fff';x.fillText('LEVEL '+level,W/2,32);x.textAlign='right';x.fillStyle='#f9a8d4';x.fillText('LIVES '+lives,W-18,32);x.textAlign='left';invaders.forEach((v,i)=>{if(v.alive)pixel(v,Math.floor(i/8)%3)});x.fillStyle='#22d3ee';x.fillRect(player.x+6,player.y+8,player.w-12,16);x.fillRect(player.x+19,player.y,10,10);x.fillStyle='#fef08a';shots.forEach(b=>x.fillRect(b.x,b.y,b.w,b.h));x.fillStyle='#fb7185';enemyShots.forEach(b=>x.fillRect(b.x,b.y,b.w,b.h));if(!run){x.fillStyle='rgba(3,7,18,.72)';x.fillRect(0,55,W,H-55);x.textAlign='center';x.fillStyle='#fff';x.font='bold 38px monospace';x.fillText(lives<=0?'GAME OVER':'HARVEY!',W/2,H/2-24);x.fillStyle='#67e8f9';x.font='bold 20px monospace';x.fillText(lives<=0?'FINAL SCORE '+score:'DEFEND THE BIRTHDAY GALAXY',W/2,H/2+18);x.textAlign='left'}}
function loop(t){const dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function begin(){audioOn();reset(true);run=true;start.textContent='RESTART GAME';sfx('start')}
start.addEventListener('pointerdown',audioOn);start.addEventListener('click',begin);soundBtn.addEventListener('click',()=>{audioOn();sound=!sound;soundBtn.textContent=sound?'🔊 SOUND':'🔇 MUTED';if(sound)sfx('start')});document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();audioOn();fire()});function hold(id,k){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))}hold('left','ArrowLeft');hold('right','ArrowRight');window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(e.key===' ')fire()});window.addEventListener('keyup',e=>keys[e.key]=false);reset();draw();requestAnimationFrame(loop)
</script></body></html>
